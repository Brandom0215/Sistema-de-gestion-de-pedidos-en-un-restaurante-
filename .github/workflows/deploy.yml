name: Despliegue Automatico en Servidor Ubuntu

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar repositorio y base de datos en el servidor
        run: |
          cd /home/ubuntu/Sistema-de-gestion-de-pedidos-en-un-restaurante-
          git fetch origin
          git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          git pull origin main || git pull origin master

          if [ -f "Database/Script_PostgreSQL_Restaurante.sql" ]; then
            sudo -u postgres psql -d restaurante_db -f Database/Script_PostgreSQL_Restaurante.sql || true
          fi

          echo "Despliegue completado exitosamente en el servidor Ubuntu."
